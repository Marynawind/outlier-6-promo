<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outlier 6 Promo</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }   /* white page: the video block shows exactly where the banner ends */
  /* video at the very top, full width, no side fields; plays on its own, muted, in a loop (works on iPhone too) */
  .bd-video { display: block; width: 100%; aspect-ratio: 16 / 9; margin: 0 auto; max-width: none; background: #111112; }
  .bd-video video { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<!-- For the website: upload outlier-6-promo.mp4 and outlier-6-promo-poster.jpg,
     then replace the two file names below with their links. -->
<section class="bd-video" aria-label="Backdraft Suppressors by Outlier">
  <video autoplay muted loop playsinline preload="auto" poster="outlier-6-promo-poster.jpg">
    <source src="outlier-6-promo.mp4" type="video/mp4">
  </video>
</section>
</body>
</html>
