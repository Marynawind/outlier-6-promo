<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outlier 6 Promo</title>
<style>
  :root { --graphite: #111112; --brass: #b27b29; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--graphite); }
  /* Banner: full width, 16:9, video plays on its own, muted, in a loop (works on iPhone too) */
  .bd-banner { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--graphite); }
  .bd-banner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<!-- For the website: upload outlier-6-promo.mp4 and outlier-6-promo-poster.jpg,
     then replace the two file names below with their links. -->
<section class="bd-banner" aria-label="Backdraft Suppressors by Outlier">
  <video autoplay muted loop playsinline preload="auto" poster="outlier-6-promo-poster.jpg">
    <source src="outlier-6-promo.mp4" type="video/mp4">
  </video>
</section>
</body>
</html>
